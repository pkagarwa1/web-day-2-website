<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concert Event Card</title>
    <style>
      body {
        background: linear-gradient(135deg, #a4a8b1, #113e47);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .event-card {
        background-color: #111827;
        border: 2px solid #e6ec48;
        border-radius: 20px;
        width: 380px;
        padding: 30px;
        box-shadow: 0 0 30px rgba(236, 72, 153, 0.2);
        position: relative;
      }

      .badge {
        display: inline-block;
        background-color: #bdc522;
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: bold;
        padding: 4px 10px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.8rem;
        margin: 0 0 10px 0;
        color: #ffffff;
      }

      .info-row {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        color: #cbd5e1;
        font-size: 0.95rem;
      }

      .info-label {
        font-weight: bold;
        color: #a855f7;
        width: 90px;
      }

      .lineup {
        background-color: #1f2937;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
      }

      .lineup p {
        margin: 0 0 5px 0;
        font-size: 0.85rem;
        color: #9ca3af;
        text-transform: uppercase;
      }

      .lineup ul {
        margin: 0;
        padding-left: 18px;
        color: #f3f4f6;
        font-weight: 600;
      }

      .btn-ticket {
        display: block;
        text-align: center;
        background: linear-gradient(90deg, #bdc522, #8b5cf6);
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        padding: 14px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: opacity 0.2s ease;
      }

      .btn-ticket:hover {
        opacity: 0.9;
      }



      .btn-ticket-two {
        display: block;
        text-align: center;
        background: linear-gradient(90deg, #bdc522, #8b5cf6);
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        padding: 14px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: opacity 0.2s ease;
      }

      .btn-ticket-two:hover {
        opacity: 0.9;
      }



      .btn-ticket-three {
        display: block;
        text-align: center;
        background: linear-gradient(90deg, #bdc522, #8b5cf6);
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        padding: 14px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: opacity 0.2s ease;
      }

      .btn-ticket-three:hover {
        opacity: 0.9;
      }


    </style>
  </head>
  <body>
    <div class="event-card">
      <span class="badge">New Book</span>
      <h1>Forgetting is Normal</h1>

      <div class="info-row">
        <span class="info-label">Date:</span>
        <span>TBD (No idea when it'll be published)</span>
      </div>
      <div class="info-row">
        <span class="info-label">Venue:</span>
        <span>My new reading chair</span>
      </div>
      <div class="info-row">
        <span class="info-label">Doors:</span>
        <span>Never?</span>
      </div>

      <div class="lineup">
        <p>Featuring Performers</p>
        <ul>
          <li>Briscoe</li>
          <li>Fiona</li>
          <li>Roo</li>
        </ul>
      </div>

      <a href="http://amazon.com/author/poojaagarwal" target="_blank" class="btn-ticket">Buy My Books (Amazon yuck)</a>
      <br>
      <a href="https://www.instagram.com/yourbestfriendsband" target="_blank" class="btn-ticket-two">Follow my favorite human</a>
      <br>
      <a href="profile.html" class="btn-ticket-three">Go to my profile</a>

    </div>
  </body>
</html>
